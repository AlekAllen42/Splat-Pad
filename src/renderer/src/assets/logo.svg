<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="42 Potential logo">
  <rect width="100" height="100" rx="18" fill="#e2562c"/>
  <text x="38" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fbf3ea">42</text>
  <!-- the asterisk of "42*": six rounded arms, like the app's center star -->
  <g transform="translate(76 30)" stroke="#fbf3ea" stroke-width="4.5" stroke-linecap="round">
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(60)"/>
    <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(120)"/>
  </g>
</svg>
