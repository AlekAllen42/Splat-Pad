# Builds the Windows and Linux installers on GitHub's computers and publishes
# them as a GitHub Release, which every installed Splat Pad checks for updates.
# Runs when a version tag is pushed (see docs/RELEASING.md):  git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # lets the build create the release and upload files

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
